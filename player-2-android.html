<script>

function ov(html,c,cb){const o=document.createElement('div');o.className='ov'+(c?' c':'');o.innerHTML=`<div class="md g">${c?'':'<span class="hd"></span>'}${html}</div>`;o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o);o.close=()=>o.remove();return o}
